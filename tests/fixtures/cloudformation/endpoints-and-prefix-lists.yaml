AWSTemplateFormatVersion: '2010-09-09'
Resources:
  Service:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.4.0.0/16
  ServiceSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Service
      CidrBlock: 10.4.1.0/24
  ServiceRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Service
  EndpointGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Service
      GroupDescription: endpoint
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      ServiceName: com.amazonaws.eu-west-1.s3
      VpcId: !Ref Service
      RouteTableIds:
        - !Ref ServiceRoutes
  SqsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: com.amazonaws.eu-west-1.sqs
      VpcId: !Ref Service
      SubnetIds:
        - !Ref ServiceSubnet
      SecurityGroupIds:
        - !Ref EndpointGroup
  Office:
    Type: AWS::EC2::PrefixList
    Properties:
      PrefixListName: office
      AddressFamily: IPv4
      MaxEntries: 5
      Entries:
        - Cidr: 198.51.100.0/24
          Description: head office
        - Cidr: 203.0.113.0/24
